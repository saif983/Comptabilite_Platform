<!-- Vue principale des devis -->
<div class="devis-container">
  <!-- En-tête de page -->
  <div class="header">
    <div class="title-section">
      <h1>Devis</h1>
    </div>
    
    <div class="user-section">
      <div class="search-box">
        <input type="text" placeholder="Rechercher dans mes devis..." [(ngModel)]="searchTerm" class="search-input">
        <span class="search-icon">🔍</span>
      </div>
      <button class="new-devis-btn blue-btn" (click)="activeTab = 'create'">Nouveau devis</button>
    </div>
  </div>

  <!-- Onglet création de devis (affiché uniquement quand activeTab === 'create') -->
  <div *ngIf="activeTab === 'create'" class="create-devis-panel">
    <div class="panel-header">
      <h2>Créer un devis</h2>
      <button class="close-btn" (click)="activeTab = 'list'; chargerDevis()">×</button>
    </div>

    <form [formGroup]="devisForm" (ngSubmit)="submit()" class="devis-form">
      <div class="form-section">
        <h3>Informations générales</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" formControlName="date" class="blue-input">
          </div>
        </div>
        <div class="form-group">
          <label>Entreprise</label>
          <select formControlName="entrepriseId" (change)="onEntrepriseChange()" class="blue-select">
            <option value="" disabled selected>Choisir une entreprise</option>
            <option *ngFor="let e of entreprises" [value]="e.id">{{ e.nom }}</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <h3>Produits et services</h3>
        <div formArrayName="produitsServices" class="produits-list">
          <div *ngFor="let p of produits.controls; let i = index" [formGroupName]="i" class="produit-item">
            <div class="form-row">
              <div class="form-group produit-select">
                <label>Produit / Service</label>
                <select formControlName="produitServiceId" class="blue-select">
                  <option value="" disabled selected>Choisir un produit</option>
                  <option *ngFor="let prod of produitsServices" [value]="prod.id">{{ prod.nom }}</option>
                </select>
              </div>
              <div class="form-group quantite-input">
                <label>Quantité</label>
                <input type="number" formControlName="quantite" class="blue-input">
              </div>
              <button type="button" class="remove-btn" (click)="removeProduit(i)" title="Supprimer">×</button>
            </div>
          </div>
        </div>
        <button type="button" class="add-product-btn blue-outline-btn" (click)="addProduit()">+ Ajouter un produit</button>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="activeTab = 'list'">Annuler</button>
        <button type="submit" [disabled]="devisForm.invalid" class="submit-btn blue-btn">Créer le devis</button>
      </div>
    </form>
  </div>

  <!-- Liste des devis (affiché par défaut ou quand activeTab === 'list') -->
  <div *ngIf="activeTab === 'list'" class="list-devis-panel">
    <!-- Filtres et recherche -->
    <div class="filters-bar">
      <div class="filter-group">
        <label>Date</label>
        <div class="filter-control">
          <span>🗓️</span>
          <select [(ngModel)]="dateFilter" (change)="applyFilters()" class="blue-select">
            <option value="all">Toutes les dates</option>
            <option value="this-month">Ce mois</option>
            <option value="last-month">Mois dernier</option>
            <option value="this-year">Cette année</option>
          </select>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Numéro</label>
        <div class="filter-control">
          <span>#</span>
          <input type="text" placeholder="Filtrer par n°" [(ngModel)]="numeroFilter" (input)="applyFilters()" class="blue-input">
        </div>
      </div>
      
      <div class="filter-group">
        <label>Statut</label>
        <div class="filter-control">
          <span>⚡</span>
          <select [(ngModel)]="statutFilter" (change)="applyFilters()" class="blue-select">
            <option value="all">Tous</option>
            <option value="en attente">En attente</option>
            <option value="accepté">Accepté</option>
            <option value="refusé">Refusé</option>
          </select>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Montant</label>
        <div class="filter-control">
          <span>💰</span>
          <input type="text" placeholder="Montant" [(ngModel)]="montantFilter" (input)="applyFilters()" class="blue-input">
        </div>
      </div>
      
      <div class="filter-group enterprise-filter">
        <label>Entreprise</label>
        <div class="filter-control">
          <span>🏢</span>
          <select [(ngModel)]="selectedEntrepriseId" (change)="chargerDevis()" class="blue-select">
            <option [value]="null">Toutes</option>
            <option *ngFor="let e of entreprises" [value]="e.id">{{ e.nom }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Nouveau design de tableau vertical -->
    <div class="vertical-table-container">
      <div class="v-table-header">
        <div class="v-column date-column">
          <div class="v-header sortable" (click)="sortBy('date')">
            Date <span class="sort-icon">⬇</span>
          </div>
        </div>
        <div class="v-column numero-column">
          <div class="v-header sortable" (click)="sortBy('numDevis')">
            Numéro <span class="sort-icon">⬇</span>
          </div>
        </div>
        <div class="v-column montant-column">
          <div class="v-header sortable" (click)="sortBy('montantTotal')">
            Montant Total <span class="sort-icon">⬇</span>
          </div>
        </div>
        <div class="v-column statut-column">
          <div class="v-header sortable" (click)="sortBy('statut')">
            Statut <span class="sort-icon">⬇</span>
          </div>
        </div>
        <div class="v-column actions-column">
          <div class="v-header">
            Actions
          </div>
        </div>
      </div>
      
      <div class="v-table-body">
        <ng-container *ngFor="let devis of filteredDevisList">
          <div class="v-table-row">
            <div class="v-column date-column">
              <div class="v-cell">{{ devis.date | date:'dd MMM yyyy' }}</div>
            </div>
            <div class="v-column numero-column">
              <div class="v-cell">
                <span class="devis-icon">📄</span>
                Devis {{ devis.numDevis }}
              </div>
            </div>
            <div class="v-column montant-column">
              <div class="v-cell">{{ devis.montantTotal | number:'1.2-2' }} DT</div>
            </div>
            <div class="v-column statut-column">
              <div class="v-cell">
                <select class="status-select" 
                      [ngClass]="{'status-pending': devis.statut === 'En attente', 
                                 'status-accepted': devis.statut === 'Accepté', 
                                 'status-rejected': devis.statut === 'Refusé'}"
                      [ngModel]="devis.statut" 
                      (ngModelChange)="changeDevisStatus(devis, $event)">
                  <option value="En attente">En attente</option>
                  <option value="Accepté">Accepté</option>
                  <option value="Refusé">Refusé</option>
                </select>
              </div>
            </div>
            <div class="v-column actions-column">
              <div class="v-cell">
                <div class="action-buttons">
                  <button class="action-btn view-btn blue-icon-btn" title="Voir détails">🔍</button>
                  <button class="action-btn print-btn blue-icon-btn" title="Imprimer">🖨️</button>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
        
        <!-- Message si aucun devis trouvé -->
        <div *ngIf="filteredDevisList.length === 0" class="empty-v-table">
          Aucun devis trouvé
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <button class="pagination-btn blue-page-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">«</button>
      <span class="page-info">{{ currentPage }} à {{ totalPages }}</span>
      <button class="pagination-btn blue-page-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">»</button>
    </div>
  </div>
</div>
